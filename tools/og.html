<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Young Serif";src:url("../public/fonts/young-serif-400.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";src:url("../public/fonts/instrument-sans-var.woff2") format("woff2");font-weight:400 700}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#F6F1E6;position:relative;font-family:"Instrument Sans"}
.blob{position:absolute;right:-60px;top:-40px;width:700px;height:700px;border-radius:44% 56% 48% 52%/46% 44% 56% 54%;background:linear-gradient(170deg,#CFE1E5 0%,#E7EADB 52%,#EBDDBF 100%)}
.copy{position:absolute;left:80px;top:90px;width:560px}
.logo{height:56px}
h1{font-family:"Young Serif";font-weight:400;color:#1F3A2E;font-size:68px;line-height:1.04;letter-spacing:-.01em;margin:56px 0 26px}
h1 span{color:#4F6F4A}
p{font-size:24px;color:#56645A;margin:0}
.pill{display:inline-block;margin-top:34px;background:#1F3A2E;color:#F6F1E6;font-weight:600;font-size:20px;padding:12px 22px;border-radius:999px}
.st{position:absolute;filter:drop-shadow(0 14px 18px rgba(31,58,46,.18))}
</style></head><body>
<div class="blob"></div>
<img class="st" src="../public/stickers/wave.svg" style="width:230px;left:690px;top:70px;transform:rotate(7deg)">
<img class="st" src="../public/stickers/pine.svg" style="width:150px;left:1000px;top:40px;transform:rotate(-5deg)">
<img class="st" src="../public/stickers/mountain.svg" style="width:290px;left:800px;top:220px;transform:rotate(-8deg)">
<img class="st" src="../public/stickers/poppy.svg" style="width:140px;left:1040px;top:330px;transform:rotate(10deg)">
<img class="st" src="../public/stickers/fern.svg" style="width:140px;left:690px;top:370px;transform:rotate(-12deg)">
<div class="copy">
<img class="logo" src="../public/logo.svg">
<h1>Little pieces of the wild, <span>made to stick.</span></h1>
<p>Nature-inspired die-cut vinyl stickers.</p>
<span class="pill">First drop coming soon · naturestickers.shop</span>
</div></body></html>
